<section class="page" *ngIf="!loading(); else loadingState">
  <header><div><h1>{{ 'levelUpAnnouncements.title' | transloco }}</h1><p>{{ 'levelUpAnnouncements.description' | transloco }}</p></div><div class="actions"><button type="button" (click)="test()" [disabled]="!selectedMessage">{{ 'levelUpAnnouncements.test' | transloco }}</button></div></header>
  <p class="error" *ngIf="error()">{{ error() }}</p>
  <div class="scope-tabs" role="tablist"><button type="button" role="tab" [attr.aria-selected]="scope() === 'Lifetime'" [class.selected]="scope() === 'Lifetime'" (click)="selectScope('Lifetime')">Server-Level</button><button type="button" role="tab" [attr.aria-selected]="scope() === 'Season'" [class.selected]="scope() === 'Season'" (click)="selectScope('Season')">Season-Level</button></div>
  <div class="panel" *ngIf="profile as value"><div class="controls"><label><input type="checkbox" [(ngModel)]="value.enabled" (ngModelChange)="changed()"> {{ 'levelUpAnnouncements.enabled' | transloco }}</label><rk-discord-channel-picker [label]="'levelUpAnnouncements.channel' | transloco" [channels]="channelOptions()" [value]="value.channelId" [allowedTypes]="['Text']" [placeholder]="'xp.chooseChannel' | transloco" [searchPlaceholder]="'channelPicker.search' | transloco" [emptyText]="'channelPicker.empty' | transloco" [noResultsText]="'channelPicker.noResults' | transloco" [required]="value.enabled" [errorText]="value.enabled && !value.channelId ? ('levelUpAnnouncements.channelRequired' | transloco) : ''" (valueChange)="value.channelId = $event; changed()" /><label><input type="checkbox" [(ngModel)]="value.notifyUser" (ngModelChange)="changed()"> {{ 'levelUpAnnouncements.notify' | transloco }}</label><label>{{ 'levelUpAnnouncements.repetition' | transloco }}<input type="number" min="0" max="20" [(ngModel)]="value.avoidRecentMessagesPerUser" (ngModelChange)="changed()"></label><label><input type="checkbox" [(ngModel)]="value.useDefaultFallback" (ngModelChange)="changed()"> System fallback</label></div></div>
  <div class="kind-tabs" role="tablist"><button type="button" [class.selected]="kind() === 'LevelUp'" (click)="selectKind('LevelUp')">Level Up</button><button type="button" [class.selected]="kind() === 'Reward'" (click)="selectKind('Reward')">Rewards</button></div>
  <div class="workspace"><aside class="panel template-panel"><button type="button" (click)="addGroup()">{{ 'levelUpAnnouncements.add' | transloco }}</button><div class="template-list-item" *ngFor="let group of groups"><button type="button" [class.selected]="group.id === selectedGroupId()" (click)="selectedGroupId.set(group.id); selectedMessageId.set(group.messages[0].id)">{{ group.name }} · {{ probability(group) }}%</button><span>{{ group.messages.length }} messages</span><button type="button" (click)="removeGroup(group)">{{ 'levelUpAnnouncements.delete' | transloco }}</button></div></aside>
    <main class="panel" *ngIf="selectedGroup as group"><div class="row"><label>{{ 'levelUpAnnouncements.name' | transloco }}<input [(ngModel)]="group.name" (ngModelChange)="changed()"></label><label>{{ 'levelUpAnnouncements.weight' | transloco }}<input type="number" min="1" [(ngModel)]="group.weight" (ngModelChange)="changed()"></label><label><input type="checkbox" [(ngModel)]="group.enabled" (ngModelChange)="changed()"> {{ 'levelUpAnnouncements.templateEnabled' | transloco }}</label></div><details><summary>Optionale Auswahlregeln</summary><div class="row"><label>Minimum level<input type="number" [(ngModel)]="group.conditions.minimumLevel" (ngModelChange)="changed()"></label><label>Maximum level<input type="number" [(ngModel)]="group.conditions.maximumLevel" (ngModelChange)="changed()"></label><label>Every nth level<input type="number" [(ngModel)]="group.conditions.everyNthLevel" (ngModelChange)="changed()"></label></div></details><button type="button" (click)="addMessage()">Add message</button><article class="message-card" *ngFor="let message of group.messages"><div class="row"><label><input type="checkbox" [(ngModel)]="message.enabled" (ngModelChange)="changed()"> {{ 'levelUpAnnouncements.templateEnabled' | transloco }}</label><button type="button" (click)="selectedMessageId.set(message.id)">Edit</button><button type="button" (click)="removeMessage(message)" [disabled]="group.messages.length === 1">{{ 'levelUpAnnouncements.delete' | transloco }}</button></div><textarea #content rows="6" maxlength="500" [(ngModel)]="message.content" (ngModelChange)="changed()" [attr.aria-label]="'Message content'"></textarea><small>{{ message.content.length }}/500</small><div class="tokens" *ngIf="message.id === selectedMessageId()"><button type="button" *ngFor="let token of availableTokens()" (click)="insertToken(token.name, content)">{{ '{' + token.name + '}' }}</button></div></article></main></div>
  <rk-sticky-save-bar [dirty]="dirty()" [saving]="saving()" [valid]="valid()" [resetLabel]="'levelUpAnnouncements.reset' | transloco" [validationMessage]="'levelUpAnnouncements.channelRequired' | transloco" (save)="save()" (reset)="reset()" />
</section><ng-template #loadingState><p>{{ 'common.loading' | transloco }}</p></ng-template>
