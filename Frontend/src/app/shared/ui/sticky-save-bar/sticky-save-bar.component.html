@if (dirty) { <aside class="rk-save-bar" aria-live="polite"><div><strong>{{ message || ('saveBar.unsaved' | transloco) }}</strong>@if (contextName) { <span>{{ contextName }}</span> } @if (!valid) { <small role="alert">{{ validationMessage || ('saveBar.invalid' | transloco) }}</small> }</div><div class="rk-save-bar__actions"><button class="rk-button rk-button--ghost" type="button" [disabled]="saving" (click)="reset.emit()">{{ resetLabel || ('saveBar.reset' | transloco) }}</button><button class="rk-button rk-button--primary" type="button" [disabled]="saving || !valid" [attr.aria-busy]="saving" (click)="save.emit()">@if (saving) { <span class="rk-spinner" aria-hidden="true"></span> } {{ saveLabel || (saving ? ('common.saving' | transloco) : ('common.saveChanges' | transloco)) }}</button></div></aside> }
